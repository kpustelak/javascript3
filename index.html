<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Country Search</title>
</head>
<body>

<main>
    <form id="countryForm">
        <label for="q">Country name:</label>
        <br>
        <input type="text" id="q" name="q">
        <br>
        <input type="submit" value="Search">
    </form>

    <div id="results">
        <table>
            <thead>
            <th>Name</th>
            <th>Capital</th>
            <th>Population</th>
            <th>Region</th>
            <th>Subregion</th>
            </thead>
        </table>
    </div>
</main>

<script src="file.js"></script>

</body>
</html>
